name: phase16-lockgen
on:
  push:
    branches:
      - security/phase16-hardening
permissions:
  contents: write
jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Restore Phase 15 lock and regenerate hashes
        run: |
          git show d30976868738109b38303a33f327d6ea9e53e106:backend/requirements.lock > backend/requirements.lock
          python -m pip install --disable-pip-version-check pip-tools==7.6.1
          pip-compile --generate-hashes --no-upgrade --reuse-hashes --output-file backend/requirements.lock backend/requirements.txt
          sed -i 's/pip-compile --generate-hashes --no-index --output-file=backend\/requirements.lock backend\/requirements.txt/pip-compile --generate-hashes --no-upgrade --reuse-hashes --output-file=backend\/requirements.lock backend\/requirements.txt/' backend/requirements.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/requirements.lock
          git diff --cached --quiet || (git commit -m 'Phase 16: restore hash-locked Python dependencies' && git push origin HEAD:security/phase16-hardening)
