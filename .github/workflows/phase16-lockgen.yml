name: phase16-lockgen
on:
  push:
    branches:
      - security/phase16-hardening
permissions:
  contents: read
jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Generate hash lock
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.1
          pip-compile --generate-hashes --no-upgrade --output-file /tmp/requirements.lock backend/requirements.txt
          cat /tmp/requirements.lock
