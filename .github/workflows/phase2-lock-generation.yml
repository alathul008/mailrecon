name: Phase 2 lock generation
on:
  push:
    branches: [security/phase2-dependency-remediation]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: cd frontend && npm install vitest@4.1.11 --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet || git commit -m 'chore: regenerate frontend lockfile for Vitest 4'
          git push
