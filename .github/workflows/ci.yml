name: CI
on: [push,pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13'}
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - run: pip-audit -r backend/requirements.txt --strict
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22',cache: 'npm',cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npm audit --audit-level=high
      - run: cd frontend && npm run test
      - run: cd frontend && npm run lint
      - run: cd frontend && npx tsc -b --pretty false
      - run: cd frontend && npm run build
